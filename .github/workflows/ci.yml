name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9 build,
    # and 3.9 is still the floor this package supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hatch and build
        run: pip install hatch build
      - name: Lint
        run: hatch run lint
      - name: Type check
        run: hatch run type
      - name: Test
        run: hatch run test
      - name: Build distributions
        run: python -m build
