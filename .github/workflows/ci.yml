name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9 build,
    # and 3.9 is still the floor this package supports.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hatch and build
        run: pip install hatch build
      - name: Lint
        run: hatch run lint
      - name: Type check
        run: hatch run type
      - name: Test
        run: hatch run test
      - name: Build distributions
        run: python -m build
